<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign up - Meal Planner</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #7C93A6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #F3F1EA; border-radius: 10px; padding: 32px; width: 320px; }
    h1 { font-size: 18px; margin: 0 0 20px; color: #161A1F; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #D8D4C8; border-radius: 6px; font-size: 13px; box-sizing: border-box; background: #fff; color: #161A1F; }
    button { width: 100%; padding: 10px; border: none; border-radius: 20px; background: #161A1F; color: #fff; font-size: 13px; cursor: pointer; margin-top: 8px; font-weight: 500; }
    button:hover { background: #333; }
    .error-box { background: #F4DEDC; border: 1px solid #DDB3AE; color: #7A2E24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    p { text-align: center; font-size: 13px; margin-top: 16px; }
    a { color: #5B7C99; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create an account</h1>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password (min 8 characters)" required minlength="8" />
      <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="/login">Log in</a></p>
  </div>
</body>
</html>
