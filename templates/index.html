<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meal Planner</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #7C93A6; color: #161A1F; }
    header { padding: 20px 32px; background: #161A1F; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: #C9D4DE; text-decoration: none; font-size: 13px; }
    .container { max-width: 920px; margin: 24px auto; padding: 0 24px; }
    .card { background: #F3F1EA; border-radius: 10px; padding: 22px; margin-bottom: 20px; overflow-x: auto; }
    .card h2 { margin-top: 0; font-size: 16px; color: #161A1F; }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    input, select { padding: 9px; border: 1px solid #D8D4C8; border-radius: 6px; font-size: 13px; flex: 1; min-width: 130px; background: #fff; color: #161A1F; }
    button { padding: 10px 18px; border: none; border-radius: 20px; background: #161A1F; color: #fff; font-size: 13px; cursor: pointer; font-weight: 500; }
    button:hover { background: #333; }
    button.small { padding: 4px 10px; font-size: 11px; }
    button.secondary { background: #6B7A87; }
    .error-box { background: #F4DEDC; border: 1px solid #DDB3AE; color: #7A2E24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    .stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-box { flex: 1; min-width: 90px; background: #fff; border-radius: 8px; padding: 12px; text-align: center; }
    .stat-box .value { font-size: 18px; font-weight: bold; color: #5B7C99; }
    .stat-box .label { font-size: 10px; color: #8A8578; margin-top: 4px; }
    .floor-warning { background: #F0E4CF; color: #6B4E1F; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
    .override-note { font-size: 11px; color: #5B7C99; margin-top: 4px; }
    .weight-banner { background: #F3F1EA; border-radius: 10px; padding: 14px 22px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .weight-banner .value { font-size: 16px; font-weight: bold; color: #5B7C99; }
    .weight-banner a { color: #5B7C99; text-decoration: none; font-size: 12px; }
    .day-total-cell-clean { font-weight: 600; text-align: right; }
    .summary-text { font-size: 14px; color: #4A453C; margin-bottom: 16px; font-style: italic; }

    table.plan-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.plan-table th { text-align: left; padding: 8px 10px; background: #E4E0D3; border-bottom: 2px solid #D8D4C8; text-transform: capitalize; color: #161A1F; }
    table.plan-table td { padding: 8px 10px; border-bottom: 1px solid #E4E0D3; vertical-align: top; }
    .day-label { font-weight: 600; white-space: nowrap; }
    .day-total-cell { font-size: 11px; color: #6B7A87; }
    .cell-meal-name { font-weight: 500; }
    .cell-meal-cal { color: #8A8578; font-size: 11px; }
    .edit-link { font-size: 10px; color: #fff; background: #161A1F; cursor: pointer; border: none; padding: 2px 10px; border-radius: 10px; margin-top: 4px; display: inline-block; }
    .edit-box { background: #fff; border: 1px solid #E4E0D3; border-radius: 6px; padding: 8px; margin-top: 6px; min-width: 180px; }
    .edit-box select, .edit-box input { width: 100%; margin-bottom: 6px; font-size: 12px; padding: 6px; }
    .edit-mode-toggle { font-size: 11px; margin-bottom: 6px; display: flex; gap: 10px; }
    .edit-mode-toggle a { color: #5B7C99; cursor: pointer; text-decoration: underline; }
    .edit-actions { display: flex; gap: 6px; }
    .qty-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .qty-row input { margin-bottom: 0 !important; }
    .qty-unit { font-size: 12px; color: #4A453C; white-space: nowrap; }
    .qty-preview { font-size: 11px; color: #5B7C99; font-weight: 600; margin-bottom: 6px; }

    /* Daily calorie total */
    .day-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .day-nav input { flex: 0 1 170px; min-width: 140px; }
    .day-nav button { padding: 7px 12px; font-size: 12px; }
    .range-inputs { display: flex; gap: 4px; align-items: center; justify-content: center; }
    .range-inputs input { width: 64px; min-width: 0; flex: none; padding: 4px; font-size: 13px; text-align: center; }
    @media (max-width: 480px) {
      #dayStats .stat-box.range-box { order: 5; flex-basis: 100%; }
    }
    .status-under { color: #8A6A1F !important; }
    .status-in { color: #3F7A4E !important; }
    .status-over { color: #8A5049 !important; }
    .add-entry { background: #fff; border: 1px solid #E4E0D3; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .add-entry .form-row { align-items: center; }
    .entry-group-title { font-size: 12px; font-weight: 600; color: #5B7C99; margin: 12px 0 4px; }
    .entry-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #E4E0D3; font-size: 13px; }
    .entry-row .entry-amount { color: #8A8578; font-size: 12px; }
    .entry-row .entry-cal { font-weight: 600; white-space: nowrap; }
    .remove-x { background: none; color: #8A5049; padding: 2px 8px; font-size: 16px; line-height: 1; }
    .remove-x:hover { background: #F4DEDC; }
    .day-footer { display: flex; justify-content: space-between; font-weight: 700; padding-top: 10px; font-size: 14px; }
    .link-btn { background: none; color: #5B7C99; padding: 0; font-size: 12px; text-decoration: underline; border-radius: 0; }
    .link-btn:hover { background: none; color: #161A1F; }

    /* Clean, screenshot/print-friendly view - no edit UI, matches a
       simple weekday-letter food timetable format. */
    table.clean-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.clean-table th { text-align: left; padding: 10px 12px; background: #E4E0D3; border: 1px solid #D8D4C8; text-transform: capitalize; color: #161A1F; }
    table.clean-table td { padding: 10px 12px; border: 1px solid #D8D4C8; vertical-align: top; }
    table.clean-table .day-letter { font-weight: 700; text-align: center; }
    .clean-cal { color: #8A8578; font-size: 11px; }
    .view-toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .view-toggle-row button { padding: 6px 14px; font-size: 12px; }

    @media print {
      body * { visibility: hidden; }
      #cleanPlanSection, #cleanPlanSection * { visibility: visible; }
      #cleanPlanSection { position: absolute; top: 0; left: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <h1>Meal Planner</h1>
    <div>
      <a href="/foods" style="color:#C9D4DE;text-decoration:none;font-size:13px;margin-right:16px;">My Foods</a>
      <a href="/activity" style="color:#C9D4DE;text-decoration:none;font-size:13px;margin-right:16px;">Activity</a>
      <a href="/weight" style="color:#C9D4DE;text-decoration:none;font-size:13px;margin-right:16px;">Weight</a>
      <a href="/logout">Log out ({{ current_user.email }})</a>
    </div>
  </header>
  <div class="container">

    <div id="currentWeightBanner" class="no-print"></div>

    <div class="card no-print">
      <h2>Your profile</h2>
      <div id="formError"></div>
      <div class="form-row">
        <input type="number" id="weight" placeholder="Weight (kg)" />
        <input type="number" id="height" placeholder="Height (cm)" />
        <input type="number" id="age" placeholder="Age" />
      </div>
      <div class="form-row">
        <select id="sex">
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
        <select id="activityLevel">
          <option value="sedentary">Sedentary (little exercise)</option>
          <option value="light">Light (1-3 days/week)</option>
          <option value="moderate">Moderate (3-5 days/week)</option>
          <option value="active">Active (6-7 days/week)</option>
          <option value="very_active">Very active</option>
        </select>
      </div>
      <div class="form-row">
        <select id="goal">
          <option value="lose">Lose weight</option>
          <option value="maintain">Maintain weight</option>
          <option value="gain">Gain weight</option>
        </select>
        <select id="region">
          <option value="nigeria">Nigeria</option>
          <option value="us">United States</option>
        </select>
        <input type="hidden" id="days" value="5" />
      </div>
      <div class="form-row">
        <input type="number" id="calorieOverride" placeholder="Override calories (optional)" style="flex:1;" />
      </div>
      <p style="font-size:12px;color:#999;margin-top:-6px;">Plans always run Monday through Friday. Leave the calorie field blank to use the calculated target, or fill it in to set your own.</p>
      <button onclick="generatePlan()">Generate plan</button>
    </div>

    <div id="targetsCard" class="no-print"></div>
    <div id="planCard" class="no-print"></div>

    <div class="card no-print" id="dayTotalCard">
      <h2>Daily calorie total</h2>
      <div class="day-nav">
        <button class="secondary" onclick="shiftDay(-1)">&larr; Prev</button>
        <input type="date" id="dayDate" onchange="loadDay()" />
        <button class="secondary" onclick="shiftDay(1)">Next &rarr;</button>
        <button class="secondary" onclick="setToday()">Today</button>
      </div>
      <div class="stat-row" id="dayStats"></div>
      <div class="add-entry">
        <div id="dayError"></div>
        <div id="dayLibraryFields">
          <div class="form-row">
            <select id="dayMeal" style="flex:0 1 130px;">
              <option value="breakfast">Breakfast</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
              <option value="snack">Snack</option>
              <option value="other">Other</option>
            </select>
            <select id="dayFood" onchange="onDayFoodChange()" style="flex:2 1 220px;"></select>
          </div>
          <div class="form-row">
            <div class="qty-row" style="flex:1;margin:0;">
              <input type="number" id="dayQty" step="any" min="0" placeholder="Amount" oninput="updateDayPreview()" style="flex:0 1 110px;min-width:80px;" />
              <span class="qty-unit" id="dayUnit"></span>
              <span class="qty-preview" id="dayPreview" style="margin:0;"></span>
            </div>
            <button onclick="addDayEntry()">Add</button>
          </div>
          <button class="link-btn" onclick="setDayMode('manual')">Something not in my foods? Enter it manually</button>
        </div>
        <div id="dayManualFields" style="display:none;">
          <div class="form-row">
            <select id="dayMealManual" style="flex:0 1 130px;">
              <option value="breakfast">Breakfast</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
              <option value="snack">Snack</option>
              <option value="other" selected>Other</option>
            </select>
            <input type="text" id="dayManualName" placeholder="Food name" style="flex:2 1 180px;" />
          </div>
          <div class="form-row">
            <input type="number" id="dayManualQty" step="any" min="0" placeholder="Amount (optional)" />
            <input type="text" id="dayManualUnit" placeholder="Unit (g, slice...)" list="unitOptions" />
            <input type="number" id="dayManualCal" step="any" min="0" placeholder="Calories" />
            <button onclick="addDayEntry()">Add</button>
          </div>
          <button class="link-btn" onclick="setDayMode('library')">Pick from my foods instead</button>
        </div>
      </div>
      <div id="dayEntries"></div>
    </div>
    <datalist id="unitOptions">
      <option value="g"></option><option value="ml"></option><option value="slice"></option><option value="piece"></option>
      <option value="egg"></option><option value="tbsp"></option><option value="cup"></option><option value="serving"></option>
    </datalist>
    <div id="cleanPlanSection"></div>

  </div>

  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    const MEAL_TYPES = ['breakfast', 'lunch', 'dinner', 'snack'];
    const WEEKDAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    const WEEKDAY_LETTERS = ['M', 'T', 'W', 'T', 'F'];
    let myFoods = [];
    let currentPlan = [];
    let cleanViewOpen = false;

    async function loadFoodsForEditing() {
      const res = await fetch('/api/foods');
      myFoods = await res.json();
    }

    function weekdayLabel(dayIndex) {
      // Fixed Monday-Friday, not relative to today's real date - the
      // plan is always a standard 5-day workweek timetable.
      return WEEKDAY_NAMES[dayIndex - 1] || `Day ${dayIndex}`;
    }

    function weekdayLetter(dayIndex) {
      return WEEKDAY_LETTERS[dayIndex - 1] || '?';
    }

    async function generatePlan() {
      const errorBox = document.getElementById('formError');
      errorBox.innerHTML = '';
      document.getElementById('planCard').innerHTML = '<div class="card"><p style="text-align:center;color:#999;">Generating...</p></div>';

      const payload = {
        weight_kg: document.getElementById('weight').value,
        height_cm: document.getElementById('height').value,
        age: document.getElementById('age').value,
        sex: document.getElementById('sex').value,
        activity_level: document.getElementById('activityLevel').value,
        goal: document.getElementById('goal').value,
        region: document.getElementById('region').value,
        days: document.getElementById('days').value || 7,
      };
      const override = document.getElementById('calorieOverride').value;
      if (override) payload.calorie_override = override;

      try {
        const res = await fetch('/api/generate-plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.innerHTML = `<div class="error-box">${esc(data.error)}</div>`;
          document.getElementById('planCard').innerHTML = '';
          return;
        }

        renderTargets(data.profile_targets, data.summary);
        await loadFoodsForEditing();
        currentPlan = data.plan;
        renderPlanTable(); renderCleanTable();
      } catch (err) {
        errorBox.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
        document.getElementById('planCard').innerHTML = '';
      }
    }

    function renderTargets(t, summary) {
      let html = '<div class="card"><h2>Your targets</h2>';
      if (t.floor_applied) {
        html += `<div class="floor-warning">Your calculated deficit went below a safe minimum, so the target was capped at 1200 calories/day instead.</div>`;
      }
      html += `<div class="stat-row">
        <div class="stat-box"><div class="value">${t.calorie_target}</div><div class="label">kcal/day</div></div>
        <div class="stat-box"><div class="value">${t.macros.protein_g}g</div><div class="label">Protein</div></div>
        <div class="stat-box"><div class="value">${t.macros.carbs_g}g</div><div class="label">Carbs</div></div>
        <div class="stat-box"><div class="value">${t.macros.fat_g}g</div><div class="label">Fat</div></div>
      </div>`;
      if (t.overridden) html += `<p class="override-note">Using your manually set calorie target instead of the calculated one.</p>`;
      if (summary) html += `<p class="summary-text">${esc(summary)}</p>`;
      html += '</div>';
      document.getElementById('targetsCard').innerHTML = html;
    }

    async function loadWeightBanner() {
      const res = await fetch('/api/weight/latest');
      const latest = await res.json();
      const banner = document.getElementById('currentWeightBanner');
      if (!latest) {
        banner.innerHTML = `<div class="weight-banner"><span>No weight logged yet.</span><a href="/weight">Log your weight &rarr;</a></div>`;
        return;
      }
      banner.innerHTML = `
        <div class="weight-banner">
          <span>Current weight: <span class="value">${latest.weight_kg} kg</span> <span style="color:#8A8578;">(${latest.logged_date})</span></span>
          <a href="/weight">View progress &rarr;</a>
        </div>
      `;
    }

    function findMeal(day, mealType) {
      return day.meals.find((m) => m.meal_type === mealType);
    }

    function renderPlanTable() {
      if (!currentPlan || currentPlan.length === 0) {
        document.getElementById('planCard').innerHTML = '';
        return;
      }

      let html = '<div class="card"><div class="view-toggle-row"><h2 style="margin:0;">Your plan</h2><button onclick="toggleCleanView()">Screenshot / Print view</button></div><table class="plan-table"><thead><tr><th>Day</th>';
      MEAL_TYPES.forEach((mt) => { html += `<th>${mt}</th>`; });
      html += '<th>Total</th></tr></thead><tbody>';

      currentPlan.forEach((day) => {
        html += `<tr><td class="day-label">${weekdayLabel(day.day)}</td>`;
        MEAL_TYPES.forEach((mt) => {
          const meal = findMeal(day, mt);
          html += `<td>${meal ? renderCell(meal, 'plan') : '<span style="color:#ccc;">-</span>'}</td>`;
        });
        html += `<td class="day-total-cell">${day.totals.calories} kcal<br>P:${day.totals.protein_g}g C:${day.totals.carbs_g}g F:${day.totals.fat_g}g</td>`;
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      document.getElementById('planCard').innerHTML = html;
    }

    // ctx distinguishes the editable plan table ('plan') from the clean
    // print/screenshot table ('clean') so the same meal can have an
    // independent edit box open in either view without id collisions.
    function cellId(mealId, ctx) { return `${ctx}-cell-${mealId}`; }

    const MEASURE_UNITS = ['g', 'kg', 'ml', 'l', 'oz', 'tbsp', 'tsp'];

    function num(value) {
      return Math.round(Number(value) * 10) / 10;
    }

    // "10 g", "1 slice", "2 slices"
    function amount(n, unit) {
      n = num(n);
      unit = unit || 'g';
      if (MEASURE_UNITS.includes(unit.toLowerCase()) || n === 1 || /s$/.test(unit)) return `${n} ${unit}`;
      return `${n} ${unit}s`;
    }

    function servingText(f) {
      return `${num(f.serving_calories)} kcal / ${amount(f.serving_size, f.serving_unit)}`;
    }

    function foodOptionsHtml(selectedId) {
      if (myFoods.length === 0) return '<option value="">No foods in your library yet</option>';
      return ['breakfast', 'lunch', 'dinner', 'snack', 'other'].map((cat) => {
        const foods = myFoods.filter((f) => f.meal_category === cat);
        if (foods.length === 0) return '';
        return `<optgroup label="${cat}">${foods.map((f) => `<option value="${f.id}" ${f.id === selectedId ? 'selected' : ''}>${esc(f.name)} (${esc(servingText(f))})</option>`).join('')}</optgroup>`;
      }).join('');
    }

    function foodById(id) {
      return myFoods.find((f) => f.id === Number(id));
    }

    function gramsLabel(meal) {
      return meal.grams ? ` &middot; ${esc(amount(meal.grams, meal.unit))}` : '';
    }

    function renderCell(meal, ctx) {
      return `
        <div id="${cellId(meal.id, ctx)}">
          <div class="cell-meal-name">${esc(meal.name)}</div>
          <div class="cell-meal-cal">${meal.calories} kcal${gramsLabel(meal)}</div>
          <button class="edit-link no-print" onclick="showEditBox(${meal.id}, '${ctx}')">Edit</button>
        </div>
      `;
    }

    function toggleCleanView() {
      cleanViewOpen = !cleanViewOpen;
      renderCleanTable();
    }

    function renderCleanTable() {
      const container = document.getElementById('cleanPlanSection');
      if (!cleanViewOpen || !currentPlan || currentPlan.length === 0) {
        container.innerHTML = '';
        return;
      }

      let html = '<div class="card">';
      html += '<div class="view-toggle-row no-print"><h2 style="margin:0;">Meal Plan</h2>';
      html += '<div><button onclick="window.print()">Print / Save as PDF</button> ';
      html += '<button class="secondary" onclick="toggleCleanView()">Back to editing</button></div></div>';

      html += '<table class="clean-table"><thead><tr><th>Days</th>';
      MEAL_TYPES.forEach((mt) => { html += `<th>${mt}</th>`; });
      html += '<th>Total</th></tr></thead><tbody>';

      currentPlan.forEach((day) => {
        html += `<tr><td class="day-letter">${weekdayLetter(day.day)}</td>`;
        MEAL_TYPES.forEach((mt) => {
          const meal = findMeal(day, mt);
          html += `<td>${meal ? renderCell(meal, 'clean') : ''}</td>`;
        });
        html += `<td class="day-total-cell-clean">${day.totals.calories} kcal</td>`;
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function showEditBox(mealId, ctx) {
      const cell = document.getElementById(cellId(mealId, ctx));
      const meal = currentPlan.flatMap((d) => d.meals).find((m) => m.id === mealId);
      const selectedId = meal && meal.food_id ? meal.food_id : (myFoods[0] && myFoods[0].id);
      const selectedFood = foodById(selectedId);
      const prefillQty = (meal && meal.food_id && meal.grams) ? meal.grams : (selectedFood ? selectedFood.serving_size : '');

      cell.innerHTML += `
        <div class="edit-box no-print" id="${ctx}-editbox-${mealId}">
          <div class="edit-mode-toggle">
            <a onclick="setEditMode(${mealId}, '${ctx}', 'library')" id="${ctx}-mode-library-${mealId}"><b>From my foods</b></a>
            <a onclick="setEditMode(${mealId}, '${ctx}', 'manual')" id="${ctx}-mode-manual-${mealId}">Enter manually</a>
          </div>
          <div id="${ctx}-library-fields-${mealId}">
            <select id="${ctx}-foodSelect-${mealId}" onchange="onCellFoodChange(${mealId}, '${ctx}')">${foodOptionsHtml(selectedId)}</select>
            <div class="qty-row">
              <input type="number" id="${ctx}-grams-${mealId}" placeholder="Amount" value="${prefillQty}" step="any" min="0" oninput="updateCellPreview(${mealId}, '${ctx}')" />
              <span class="qty-unit" id="${ctx}-unit-${mealId}">${esc(selectedFood ? selectedFood.serving_unit : '')}</span>
            </div>
            <div class="qty-preview" id="${ctx}-preview-${mealId}"></div>
          </div>
          <div id="${ctx}-manual-fields-${mealId}" style="display:none;">
            <input type="text" id="${ctx}-manualName-${mealId}" placeholder="Food name" />
            <input type="number" id="${ctx}-manualCal-${mealId}" placeholder="Calories" />
            <div class="qty-row">
              <input type="number" id="${ctx}-manualGrams-${mealId}" placeholder="Amount (optional)" step="any" min="0" />
              <input type="text" id="${ctx}-manualUnit-${mealId}" placeholder="Unit" list="unitOptions" style="max-width:80px;min-width:60px;" />
            </div>
          </div>
          <div class="edit-actions">
            <button class="small" onclick="saveEdit(${mealId}, '${ctx}')">Save</button>
            <button class="small secondary" onclick="cancelEdit()">Cancel</button>
          </div>
        </div>
      `;
      updateCellPreview(mealId, ctx);
    }

    function onCellFoodChange(mealId, ctx) {
      const food = foodById(document.getElementById(`${ctx}-foodSelect-${mealId}`).value);
      if (!food) return;
      document.getElementById(`${ctx}-grams-${mealId}`).value = food.serving_size;
      document.getElementById(`${ctx}-unit-${mealId}`).textContent = food.serving_unit;
      updateCellPreview(mealId, ctx);
    }

    function updateCellPreview(mealId, ctx) {
      const out = document.getElementById(`${ctx}-preview-${mealId}`);
      const food = foodById(document.getElementById(`${ctx}-foodSelect-${mealId}`).value);
      const qty = parseFloat(document.getElementById(`${ctx}-grams-${mealId}`).value);
      out.textContent = food && qty >= 0 ? `= ${num(food.calories_per_100g * qty / 100)} kcal` : '';
    }

    function setEditMode(mealId, ctx, mode) {
      document.getElementById(`${ctx}-library-fields-${mealId}`).style.display = mode === 'library' ? 'block' : 'none';
      document.getElementById(`${ctx}-manual-fields-${mealId}`).style.display = mode === 'manual' ? 'block' : 'none';
      document.getElementById(`${ctx}-mode-library-${mealId}`).innerHTML = mode === 'library' ? '<b>From my foods</b>' : 'From my foods';
      document.getElementById(`${ctx}-mode-manual-${mealId}`).innerHTML = mode === 'manual' ? '<b>Enter manually</b>' : 'Enter manually';
    }

    function cancelEdit() {
      renderPlanTable(); renderCleanTable();
    }

    async function saveEdit(mealId, ctx) {
      const isManual = document.getElementById(`${ctx}-manual-fields-${mealId}`).style.display === 'block';
      let payload;

      if (isManual) {
        payload = {
          food_name: document.getElementById(`${ctx}-manualName-${mealId}`).value.trim(),
          calories: document.getElementById(`${ctx}-manualCal-${mealId}`).value,
          grams: document.getElementById(`${ctx}-manualGrams-${mealId}`).value || null,
          unit: document.getElementById(`${ctx}-manualUnit-${mealId}`).value.trim() || null,
        };
        if (!payload.food_name || !payload.calories) {
          alert('Enter both a food name and calories.');
          return;
        }
      } else {
        const foodId = document.getElementById(`${ctx}-foodSelect-${mealId}`).value;
        if (!foodId) {
          alert('Select a food, or switch to manual entry.');
          return;
        }
        payload = {
          food_id: foodId,
          quantity: document.getElementById(`${ctx}-grams-${mealId}`).value || null,
        };
      }

      const res = await fetch(`/api/plan/meals/${mealId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Could not save this edit.');
        return;
      }

      currentPlan.forEach((day) => {
        const idx = day.meals.findIndex((m) => m.id === mealId);
        if (idx !== -1) {
          day.meals[idx] = { ...day.meals[idx], ...data.meal };
          day.totals = data.day_totals;
        }
      });
      renderPlanTable(); renderCleanTable();
    }

    async function loadExistingPlan() {
      const res = await fetch('/api/plan/latest');
      const plan = await res.json();
      if (plan.length > 0) {
        await loadFoodsForEditing();
        currentPlan = plan;
        renderPlanTable(); renderCleanTable();
      }
    }

    // ---------- Daily calorie total ----------
    let dayMode = 'library';
    let activityByDate = {};

    function readTarget() {
      try {
        const saved = JSON.parse(localStorage.getItem('dailyTargetRange') || 'null');
        if (saved && saved.min > 0 && saved.max > 0) return saved;
      } catch (e) { /* storage unavailable - use the defaults */ }
      return { min: 1200, max: 1500 };
    }

    function saveTarget() {
      const min = parseFloat(document.getElementById('targetMin').value);
      const max = parseFloat(document.getElementById('targetMax').value);
      if (!(min > 0 && max >= min)) return;
      try { localStorage.setItem('dailyTargetRange', JSON.stringify({ min, max })); } catch (e) { /* not saved, still applied */ }
      loadDay();
    }

    function isoDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function setToday() {
      document.getElementById('dayDate').value = isoDate(new Date());
      loadDay();
    }

    function shiftDay(delta) {
      const input = document.getElementById('dayDate');
      const d = input.value ? new Date(input.value + 'T12:00:00') : new Date();
      d.setDate(d.getDate() + delta);
      input.value = isoDate(d);
      loadDay();
    }

    function setDayMode(mode) {
      dayMode = mode;
      document.getElementById('dayLibraryFields').style.display = mode === 'library' ? 'block' : 'none';
      document.getElementById('dayManualFields').style.display = mode === 'manual' ? 'block' : 'none';
      document.getElementById('dayError').innerHTML = '';
    }

    function fillDayFoodSelect() {
      const select = document.getElementById('dayFood');
      const current = Number(select.value) || null;
      select.innerHTML = foodOptionsHtml(current);
      onDayFoodChange();
    }

    function onDayFoodChange() {
      const food = foodById(document.getElementById('dayFood').value);
      document.getElementById('dayUnit').textContent = food ? food.serving_unit : '';
      document.getElementById('dayQty').value = food ? food.serving_size : '';
      if (food) document.getElementById('dayMeal').value = food.meal_category;
      updateDayPreview();
    }

    function updateDayPreview() {
      const food = foodById(document.getElementById('dayFood').value);
      const qty = parseFloat(document.getElementById('dayQty').value);
      document.getElementById('dayPreview').textContent = food && qty >= 0 ? `= ${num(food.calories_per_100g * qty / 100)} kcal` : '';
    }

    async function loadActivity() {
      try {
        const res = await fetch('/api/activity');
        if (!res.ok) return;
        (await res.json()).forEach((a) => { activityByDate[a.activity_date] = a.active_calories; });
      } catch (e) { /* activity is optional here */ }
    }

    async function loadDay() {
      const date = document.getElementById('dayDate').value;
      if (!date) return;
      const res = await fetch(`/api/day-log?date=${encodeURIComponent(date)}`);
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('dayError').innerHTML = `<div class="error-box">${esc(data.error)}</div>`;
        return;
      }
      renderDay(data);
    }

    function renderDay(day) {
      const target = readTarget();
      const total = day.total_calories;
      let statusClass, statusText, statusLabel;
      if (total < target.min) {
        statusClass = 'status-under'; statusText = num(target.min - total); statusLabel = 'kcal below range';
      } else if (total > target.max) {
        statusClass = 'status-over'; statusText = num(total - target.max); statusLabel = 'kcal above range';
      } else {
        statusClass = 'status-in'; statusText = num(target.max - total); statusLabel = 'kcal left before max';
      }
      const burned = activityByDate[day.date];
      document.getElementById('dayStats').innerHTML = `
        <div class="stat-box"><div class="value">${num(total)}</div><div class="label">kcal eaten</div></div>
        <div class="stat-box range-box"><div class="range-inputs"><input type="number" id="targetMin" value="${target.min}" onchange="saveTarget()" /> - <input type="number" id="targetMax" value="${target.max}" onchange="saveTarget()" /></div><div class="label">target range (kcal)</div></div>
        <div class="stat-box"><div class="value ${statusClass}">${statusText}</div><div class="label">${statusLabel}</div></div>
        ${burned != null ? `<div class="stat-box"><div class="value">${num(burned)}</div><div class="label">kcal burned (activity)</div></div>` : ''}
      `;

      const list = document.getElementById('dayEntries');
      if (day.entries.length === 0) {
        list.innerHTML = '<p style="color:#8A8578;font-size:13px;text-align:center;">Nothing added for this day yet.</p>';
        return;
      }
      let html = '';
      ['breakfast', 'lunch', 'dinner', 'snack', 'other'].forEach((meal) => {
        const entries = day.entries.filter((e) => e.meal_type === meal);
        if (entries.length === 0) return;
        const mealTotal = entries.reduce((sum, e) => sum + e.calories, 0);
        html += `<div class="entry-group-title"><span style="text-transform:capitalize;">${meal}</span> &middot; ${num(mealTotal)} kcal</div>`;
        entries.forEach((e) => {
          html += `
            <div class="entry-row">
              <div><span>${esc(e.name)}</span> ${e.quantity != null ? `<span class="entry-amount">${esc(amount(e.quantity, e.unit))}</span>` : ''}</div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="entry-cal">${num(e.calories)} kcal</span>
                <button class="remove-x" title="Remove" onclick="removeDayEntry(${e.id})">&times;</button>
              </div>
            </div>`;
        });
      });
      html += `<div class="day-footer"><span>Total</span><span>${num(total)} kcal</span></div>`;
      list.innerHTML = html;
    }

    async function addDayEntry() {
      const errorBox = document.getElementById('dayError');
      errorBox.innerHTML = '';
      const date = document.getElementById('dayDate').value;
      let payload;
      if (dayMode === 'library') {
        const foodId = document.getElementById('dayFood').value;
        if (!foodId) {
          errorBox.innerHTML = '<div class="error-box">Add foods on the My Foods page first, or enter one manually.</div>';
          return;
        }
        payload = { date, meal_type: document.getElementById('dayMeal').value, food_id: foodId, quantity: document.getElementById('dayQty').value };
      } else {
        payload = {
          date,
          meal_type: document.getElementById('dayMealManual').value,
          food_name: document.getElementById('dayManualName').value.trim(),
          calories: document.getElementById('dayManualCal').value,
          quantity: document.getElementById('dayManualQty').value,
          unit: document.getElementById('dayManualUnit').value.trim(),
        };
        if (!payload.food_name || payload.calories === '') {
          errorBox.innerHTML = '<div class="error-box">Enter a food name and its calories.</div>';
          return;
        }
      }
      const res = await fetch('/api/day-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.innerHTML = `<div class="error-box">${esc(data.error)}</div>`;
        return;
      }
      if (dayMode === 'manual') {
        ['dayManualName', 'dayManualCal', 'dayManualQty', 'dayManualUnit'].forEach((id) => { document.getElementById(id).value = ''; });
      }
      loadDay();
    }

    async function removeDayEntry(id) {
      await fetch(`/api/day-log/${id}`, { method: 'DELETE' });
      loadDay();
    }

    async function initDayTotal() {
      document.getElementById('dayDate').value = isoDate(new Date());
      await Promise.all([loadFoodsForEditing(), loadActivity()]);
      fillDayFoodSelect();
      loadDay();
    }

    loadWeightBanner();
    loadExistingPlan();
    initDayTotal();
  </script>
</body>
</html>
